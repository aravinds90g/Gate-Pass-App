name: MobileNext Cloud Test (Android APK)

# Native EAS CI/CD counterpart to .github/workflows/mobilenext-test.yml.
# Builds the Android preview APK (eas.json `preview` profile) and runs the
# Mobilewright suite (tests/*.spec.ts) on real MobileNext Cloud devices.
#
# Required EAS secret (dashboard or `eas env:*`), in the `preview`
# environment (the test job below sets `environment: preview`, so it is
# inherited automatically at runtime — do not hardcode it here):
#   MOBILENEXT_API_KEY   (starts with `mob_`, from app.mobilenext.ai)
# No project/org ID is needed: the API acts on the organization the key
# is bound to (else the caller's default organization).
#
# Run manually with:
#   eas workflow:run .eas/workflows/mobilenext-test.yaml

on:
  push:
    branches: ['main']
  workflow_dispatch:

defaults:
  tools:
    node: '22'

jobs:
  build_android:
    name: Build Android preview APK
    type: build
    params:
      platform: android
      profile: preview

  test_mobilenext:
    name: Run MobileNext E2E tests
    needs: [build_android]
    environment: preview
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ needs.build_android.outputs.build_id }}
      - name: Stage APK for Mobilewright
        run: |
          mkdir -p build-artifacts
          cp "${{ steps.download_build.outputs.artifact_path }}" build-artifacts/app-preview.apk
          ls -lh build-artifacts/
      - name: Run Mobilewright E2E tests
        # MOBILENEXT_API_KEY is inherited from the job's `preview` EAS
        # environment; with it set the MobileNextDriver targets real cloud
        # devices (no local device exists on workers, so the key is required).
        run: npx mobilewright test
      - name: Collect test results
        # Mobilewright only writes test-results/.last-run.json (a DOTFILE,
        # invisible to the `test-results/**/*` glob below), plus
        # per-failure error-context dirs. Promote the status to a visible
        # file so the artifact upload always has something to archive.
        if: ${{ always() }}
        run: |
          mkdir -p test-results
          if [ -f test-results/.last-run.json ]; then
            cp test-results/.last-run.json test-results/last-run.json
          else
            echo '{"status":"unknown","note":"no .last-run.json produced"}' > test-results/last-run.json
          fi
          ls -la test-results/
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: mobilenext-results
          path: test-results/**/*
